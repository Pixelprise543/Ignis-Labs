<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0b2e" stop-opacity="1"/>
      <stop offset="40%" stop-color="#2d1b45" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#050505"/>
  <g fill="url(#nebula)" opacity="0.85">
    <circle cx="600" cy="300" r="200"/>
    <circle cx="1300" cy="700" r="180"/>
    <circle cx="900" cy="500" r="150"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="580" cy="280" r="40" fill="#3a86ff" opacity="0.6"/>
    <circle cx="1280" cy="680" r="30" fill="#ff006e" opacity="0.6"/>
    <circle cx="850" cy="450" r="25" fill="#ffbe0b" opacity="0.6"/>
    <circle cx="200" cy="800" r="20" fill="#fb8500" opacity="0.5"/>
    <circle cx="1700" cy="200" r="25" fill="#8338ec" opacity="0.5"/>
  </g>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="100" cy="100" r="1"/>
    <circle cx="400" cy="50" r="1"/>
    <circle cx="800" cy="200" r="1"/>
    <circle cx="1500" cy="100" r="1"/>
    <circle cx="1800" cy="400" r="1"/>
    <circle cx="1600" cy="800" r="1"/>
    <circle cx="900" cy="900" r="1"/>
    <circle cx="300" cy="700" r="1"/>
    <circle cx="700" cy="100" r="1"/>
    <circle cx="1100" cy="850" r="1"/>
  </g>
</svg>
